; TRUSTED client 1 — the poll-worker device (container "trusted-client-1",
; 172.16.0.101). Runs the `secure_client` binary and completes Phase 2 by
; presenting the ticket and PIN.
;
; Its id must appear in checkin_server/trusted_clients.txt, or the check-in
; service will refuse to accept ticket verification from it.
;
; Paths are relative to this directory, which is the container's working
; directory. Everything named here is produced by ./bootstrap.sh.

[Basic]
client_id = 1
checkin_service_host = 172.16.0.5
checkin_service_port = 6000
id_service_host = 172.16.0.6
id_service_port = 6666
log_level = info

[Security]
private_key = private_key.pem
local_cert = certificate.pem
ca_cert = ca/ca_cert.pem
