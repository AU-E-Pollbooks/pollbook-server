; UNTRUSTED client 0 — the public-facing kiosk (container "untrusted-client-0",
; 172.16.0.100). Runs the `client` binary and starts Phase 1 of a check-in.
;
; Paths are relative to this directory, which is the container's working
; directory. Everything named here is produced by ./bootstrap.sh.
;
; PollbookClient reads only the keys below: client_id, the two host/port pairs,
; and its own key/cert plus the CA cert. It needs no voter list and no PIN file
; — the C++ clients take every value from the console.

[Basic]
client_id = 0
checkin_service_host = 172.16.0.5
checkin_service_port = 6000
id_service_host = 172.16.0.6
id_service_port = 6666
log_level = info

[Security]
private_key = private_key.pem
local_cert = certificate.pem
ca_cert = ca/ca_cert.pem
