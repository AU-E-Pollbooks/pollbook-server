; Check-in service, Docker Compose deployment (container "checkin", 172.16.0.5).
;
; Paths are relative to this directory, which is the container's working
; directory. Everything named here is produced by ./bootstrap.sh.
;
; The ansible fleet deployment overwrites this file with a rendered copy; see
; ansible-configs/templates/checkin_server_config.ini.j2.

[Basic]
checkin_service_host = 172.16.0.5
checkin_service_port = 6000
; PIN-bearing roll: load_voter_list() and load_pin_mappings() both read this
; one file, so it must be the 9-column data/voters.csv, not data/id_voters.csv.
voter_list_file = voters.csv
trusted_clients_file = trusted_clients.txt
log_level = info

[Security]
private_key = private_key.pem
id_service_public_key = id_pubkey.pem
checkin_service_public_key = checkin_pubkey.pem
; Directory the service uses to cache public keys learned from client certs.
; generate_keys.sh creates it; the prefix matches src/config/sample_server_config.ini.
client_keys_folder = client_public_keys/
client_key_file_prefix = client_pubkey_
; Milliseconds. Deliberately loose for the interactive walkthrough, where a
; person types between steps. The ansible fleet runs use 120.
request_freshness_interval = 5000
; MINUTES a ticket stays valid before the voter reverts to ELIGIBLE
; (checkin_service.cpp uses std::chrono::minutes on this value).
timeout_interval = 60
checkin_service_cert = checkin_certificate.pem
id_service_cert = id_certificate.pem
local_cert = checkin_certificate.pem
ca_cert = ca/ca_cert.pem
