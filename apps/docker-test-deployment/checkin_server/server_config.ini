[Basic]
checkin_service_host = 172.16.0.5
checkin_service_port = 6000
voter_list_file = voters.csv
trusted_clients_file = trusted_clients.txt
log_level = trace

[Security]
private_key = private_key.pem
id_service_public_key = id_pubkey.pem
checkin_service_public_key = checkin_pubkey.pem
client_keys_folder = client_public_keys/
client_key_file_prefix = client_pubkey_
request_freshness_interval = 5000
checkin_service_cert = checkin_certificate.pem
id_service_cert = id_certificate.pem
local_cert = certificate.pem
ca_cert = ca/ca_cert.pem
timeout_interval = 5
