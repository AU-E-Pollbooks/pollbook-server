---
- name: Rebuild C++ binaries and restart all E-Pollbook processes (dynamic)
  hosts: localhost
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."

  pre_tasks:
    - name: Load vars (host_vars/all.yml → sc)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/all.yml"
        name: sc

  tasks:
    - name: Build inside checkin container
      ansible.builtin.shell: >
        docker exec -w /epollbook/build {{ sc.services.checkin.container }}
        bash -lc 'cmake .. && cmake --build . -j'
      register: build_checkin
      changed_when: true

    - name: Build inside id_server container
      ansible.builtin.shell: >
        docker exec -w /epollbook/build {{ sc.services.id_server.container }}
        bash -lc 'cmake .. && cmake --build . -j'
      register: build_id
      changed_when: true

    - name: Build inside client containers
      ansible.builtin.shell: >
        docker exec -w /epollbook/build {{ item.container }}
        bash -lc 'cmake .. && cmake --build . -j'
      loop: "{{ sc.clients }}"
      loop_control: { label: "{{ item.name }}" }
      register: build_clients
      changed_when: true

    # ----- stop processes (best effort) -----
    - name: Stop checkin (best-effort)
      ansible.builtin.shell: >
        docker exec {{ sc.services.checkin.container }} bash -lc
        "pkill -f '^(.*/)?server$' || true"
      changed_when: false

    - name: Stop id_server (best-effort)
      ansible.builtin.shell: >
        docker exec {{ sc.services.id_server.container }} bash -lc
        "pkill -f '^(.*/)?id_server$' || true"
      changed_when: false

    - name: Stop client processes (best-effort)
      ansible.builtin.shell: >
        docker exec {{ item.container }} bash -lc
        "pkill -f '^(.*/)?{{ "secure_client" if item.type == "trusted" else "client" }}$' || true"
      loop: "{{ sc.clients }}"
      loop_control: { label: "{{ item.name }}" }
      changed_when: false

    # ----- start processes -----
    - name: Start checkin
      ansible.builtin.shell: >
        docker exec -d -w {{ sc.services.checkin.workdir }}
        {{ sc.services.checkin.container }} ../../server

    - name: Start id_server
      ansible.builtin.shell: >
        docker exec -d -w {{ sc.services.id_server.workdir }}
        {{ sc.services.id_server.container }} ../../id_server

    - name: Start clients
      ansible.builtin.shell: >
        docker exec -d -w {{ item.workdir }} {{ item.container }}
        {{ '../../secure_client' if item.type == 'trusted' else '../../client' }}
      loop: "{{ sc.clients }}"
      loop_control: { label: "{{ item.name }}" }

    # ----- optional debug summaries -----
    - name: Show build outputs (compact)
      ansible.builtin.debug:
        msg:
          - "checkin: {{ (build_checkin.stderr|default('')).splitlines()[-5:] }}"
          - "id_server: {{ (build_id.stderr|default('')).splitlines()[-5:] }}"
          - "clients count: {{ (build_clients.results|default([]))|length }}"

