[Basic]
checkin_service_host = 172.16.0.5
checkin_service_port = 6080
voter_list_file = voters.csv
log_level = trace

[Security]
private_key = checkin_server/private_key.pem
id_service_public_key = id_server/id_pubkey.pem
checkin_service_public_key = checkin_server/checkin_pubkey.pem
client_keys_folder = checkin_server/client_public_keys
client_key_file_prefix = clientpub
request_freshness_interval = 120
checkin_service_cert = checkin_server/checkin_certificate.pem
id_service_cert = id_server/id_certificate.pem
local_cert = checkin_server/checkin_certificate.pem
ca_cert = ca/ca_cert.pem
timeout_interval = 60

