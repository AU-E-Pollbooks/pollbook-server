- name: Render and copy configs for all containers (checkin, id server, 4 clients)
  hosts: localhost
  gather_facts: false
  tasks:

    # CHECKIN SERVER
    - name: Load checkin_server config variables
      ansible.builtin.include_vars:
        file: host_vars/checkin_server.yml
        name: config_vars

    - name: Set config_vars as facts (checkin_server)
      ansible.builtin.set_fact: "{{ config_vars }}"

    - name: Render checkin_server config template
      ansible.builtin.template:
        src: templates/checkin_server_config.ini.j2
        dest: output/checkin_server_config.ini
        mode: "0644"

    - name: Copy checkin_server config into container
      ansible.builtin.command:
        cmd: docker cp output/checkin_server_config.ini pollbook-server-checkin-1:/epollbook/build/apps/docker-test-deployment/checkin_server/config.ini

    # ID SERVER
    - name: Load id_server config variables
      ansible.builtin.include_vars:
        file: host_vars/id_server.yml
        name: config_vars

    - name: Set config_vars as facts (id_server)
      ansible.builtin.set_fact: "{{ config_vars }}"

    - name: Render id_server config template
      ansible.builtin.template:
        src: templates/id_server_config.ini.j2
        dest: output/id_server_config.ini
        mode: "0644"

    - name: Copy id_server config into container
      ansible.builtin.command:
        cmd: docker cp output/id_server_config.ini pollbook-server-id-server-1:/epollbook/build/apps/docker-test-deployment/id_server/config.ini

    # TRUSTED CLIENT 1
