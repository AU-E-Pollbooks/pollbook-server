    - name: Copy client3 config into container
      ansible.builtin.command:
        cmd: docker cp output/client3_config.ini pollbook-server-trusted-client-3-1:/epollbook/build/apps/docker-test-deployment/client3/config.ini

    # UNTRUSTED CLIENT 0
    - name: Load client0 config variables
      ansible.builtin.include_vars:
        file: host_vars/client0.yml
        name: config_vars

    - name: Set config_vars as facts (client0)
      ansible.builtin.set_fact: "{{ config_vars }}"

    - name: Render client0 config template
      ansible.builtin.template:
