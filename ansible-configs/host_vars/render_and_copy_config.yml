      ansible.builtin.include_vars:
        file: host_vars/client1.yml
        name: config_vars

    - name: Set config_vars as facts (client1)
      ansible.builtin.set_fact: "{{ config_vars }}"

    - name: Render client1 config template
      ansible.builtin.template:
        src: templates/client_config.ini.j2
        dest: output/client1_config.ini
        mode: "0644"

    - name: Copy client1 config into container
      ansible.builtin.command:
        cmd: docker cp output/client1_config.ini pollbook-server-trusted-client-1-1:/epollbook/build/apps/docker-test-deployment/client1/config.ini

    # TRUSTED CLIENT 3
