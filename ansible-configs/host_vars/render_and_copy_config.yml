    - name: Copy client0 config into container
      ansible.builtin.command:
        cmd: docker cp output/client0_config.ini pollbook-server-untrusted-client-0-1:/epollbook/build/apps/docker-test-deployment/client0/config.ini

    # UNTRUSTED CLIENT 2
    - name: Load client2 config variables
      ansible.builtin.include_vars:
        file: host_vars/client2.yml
        name: config_vars

    - name: Set config_vars as facts (client2)
