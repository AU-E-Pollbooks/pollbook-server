---
- name: Render and copy configs for checkin, id-server, and clients
  hosts: localhost
  gather_facts: false

  vars:
    out_dir: "{{ playbook_dir }}/output/active"

  pre_tasks:
    - name: Load vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/host_vars/all.yml"
        name: sc

    - name: Ensure output dir exists
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: directory
        mode: "0755"

  tasks:
    # ----------------- CHECKIN -----------------
    - name: Render checkin_server config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/checkin_server_config.ini.j2"
        dest: "{{ out_dir }}/checkin_server_config.ini"
        mode: "0644"
      vars:
        checkin_service_host: "{{ sc.network.checkin_host }}"
        checkin_service_port: "{{ sc.network.checkin_port }}"
        voter_list_file: "{{ sc.services.checkin.voter_list_file | default('voters.csv') }}"
        log_level: "{{ sc.log_level }}"

        private_key: "{{ sc.paths.checkin.private_key }}"
        id_service_public_key: "{{ sc.paths.id_server.pubkey }}"
        checkin_service_public_key: "{{ sc.paths.checkin.pubkey }}"
        client_keys_folder: "{{ sc.paths.checkin.client_keys_folder }}"
        client_key_file_prefix: "{{ sc.paths.checkin.client_key_file_prefix }}"
        request_freshness_interval: "{{ sc.timing.request_freshness_interval }}"
        checkin_service_cert: "{{ sc.paths.checkin.cert }}"
        id_service_cert: "{{ sc.paths.id_server.cert }}"
        local_cert: "{{ sc.paths.checkin.cert }}"
        ca_cert: "{{ sc.paths.ca_cert }}"
        timeout_interval: "{{ sc.timing.timeout_interval }}"

    - name: Copy checkin_server config into container
      ansible.builtin.command:
        cmd: >
          docker cp {{ out_dir }}/checkin_server_config.ini
          {{ sc.services.checkin.container }}:{{ sc.services.checkin.workdir }}/config.ini

    # ----------------- ID SERVER -----------------
    - name: Render id_server config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/id_server_config.ini.j2"
        dest: "{{ out_dir }}/id_server_config.ini"
        mode: "0644"
      vars:
        id_service_host: "{{ sc.network.id_host }}"
        id_service_port: "{{ sc.network.id_port }}"
        log_level: "{{ sc.log_level }}"

        private_key: "{{ sc.paths.id_server.private_key }}"
        id_service_public_key: "{{ sc.paths.id_server.pubkey }}"
        checkin_service_public_key: "{{ sc.paths.checkin.pubkey }}"
        request_freshness_interval: "{{ sc.timing.request_freshness_interval }}"
        checkin_service_cert: "{{ sc.paths.checkin.cert }}"
        id_service_cert: "{{ sc.paths.id_server.cert }}"
        local_cert: "{{ sc.paths.id_server.cert }}"
        ca_cert: "{{ sc.paths.ca_cert }}"
        timeout_interval: "{{ sc.timing.timeout_interval }}"

    - name: Copy id_server config into container
      ansible.builtin.command:
        cmd: >
          docker cp {{ out_dir }}/id_server_config.ini
          {{ sc.services.id_server.container }}:{{ sc.services.id_server.workdir }}/config.ini

    # ----------------- CLIENTS (loop) -----------------
    - name: Render client config(s)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/client_config.ini.j2"
        dest: "{{ out_dir }}/{{ item.name }}_config.ini"
        mode: "0644"
      loop: "{{ sc.clients }}"
      loop_control: { label: "{{ item.name }}" }
      vars:
        client_id: "{{ item.id }}"
        checkin_service_host: "{{ sc.network.checkin_host }}"
        checkin_service_port: "{{ sc.network.checkin_port }}"
        id_service_host: "{{ sc.network.id_host }}"
        id_service_port: "{{ sc.network.id_port }}"
        log_level: "{{ sc.log_level }}"

        private_key: "{{ sc.paths.clients.base }}/{{ item.name }}/{{ sc.paths.clients.private_name }}"
        id_service_public_key: "{{ sc.paths.id_server.pubkey }}"

